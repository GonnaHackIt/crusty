[package]
name = "bot-rust"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rustls = { version = "0.23" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.5.2", features=["all"] }
reqwest = { version = "0.12", default-features = false }

tracing-subscriber = "*"
tracing = "*"

[patch.crates-io.symphonia]
path = "./symphonia-master/symphonia"

[patch.crates-io.symphonia-core]
path = "./symphonia-master/symphonia-core"

[dependencies.poise]
git = "https://github.com/serenity-rs/poise"
features = ["cache"]
branch = "serenity-next"

[dependencies.songbird]
git = "https://github.com/jtscuba/songbird"
branch = "davey"
features = ["serenity", "rustls", "gateway", "driver", "builtin-queue"]

[dependencies.serenity]
git = "https://github.com/serenity-rs/serenity"
branch = "next"
features = ["framework", "voice", "rustls_backend", "cache"]

[dependencies.tokio]
version = "1.0"
features = ["macros", "rt-multi-thread", "signal"]
